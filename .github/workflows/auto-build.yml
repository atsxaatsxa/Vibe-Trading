name: Vibe Trading Auto Build & Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    container: node:18-alpine  # 容器运行环境（你要的 app container）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build --if-present

      - name: Start application (test run)
        run: |
          nohup npm start &
          sleep 5
          echo "✅ Vibe Trading 项目已自动构建并运行成功！"
